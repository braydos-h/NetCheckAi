name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Run test suite (offline/mocked)
        run: python -m pytest tests/ -q -n 2 -m "not integration and not live_llm"

  sandbox:
    name: Sandbox integration (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Build sandbox worker image
        run: docker build -t breachpilot-sandbox:latest docker/sandbox
      - name: Sandbox unit + integration tests (real Docker containment)
        run: |
          python -m pytest tests/test_sandbox_models.py \
            tests/test_sandbox_policy.py \
            tests/test_sandbox_network.py \
            tests/test_sandbox_backend.py \
            tests/test_sandbox_manager.py \
            tests/test_sandbox_mcp_exec.py \
            tests/test_sandbox_integration.py -v

  browser:
    name: Browser integration (Playwright + Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Install project + dev + browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[dev,browser]"
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Chromium runtime
        run: python -m playwright install --with-deps chromium
      - name: Build sandbox base worker image (browser FROM dependency)
        run: docker build -t breachpilot-sandbox:latest docker/sandbox
      - name: Build sandbox browser worker image
        run: docker build -t breachpilot-sandbox:browser -f docker/sandbox/Dockerfile.browser docker/sandbox
      - name: Browser unit + mocked tests (no Chromium needed)
        run: |
          python -m pytest tests/test_browser_playwright_backend.py \
            tests/test_browser_manager_async.py \
            tests/test_browser_mcp_tools.py \
            tests/test_browser_integration.py \
            tests/test_no_playwright_regression.py \
            tests/test_doctor_browser.py \
            tests/test_browser_capabilities.py \
            tests/test_api_capabilities_browser.py -v
      - name: Browser live-Chromium integration (loopback only)
        run: python -m pytest tests/test_browser_integration.py -v -m integration

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Run tests with coverage
        run: python -m coverage run -m pytest tests/ -q -m "not integration and not live_llm"
      - name: Terminal coverage report
        run: python -m coverage report --fail-under=80
      - name: XML coverage report
        run: python -m coverage xml
      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error
          retention-days: 7

  lint:
    name: Lint (ruff + guards)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Cache ruff
        uses: actions/cache@v4
        with:
          path: .ruff_cache
          key: ruff-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ruff-${{ runner.os }}-
      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: MCP bare-except guard (no hidden BaseExceptionGroup)
        run: |
          # Fail if any MCP-adjacent bare `except Exception` hides a BaseExceptionGroup.
          # Anyio task groups (stdio_client / streamable_http_client / ClientSession)
          # raise BaseExceptionGroup on subprocess death — bare `except Exception` misses it.
          # Use `_EXC_GROUP_CATCH` + `_log_nested_exceptions` (tools/exceptions.py) instead.
          # Non-MCP bare excepts are allowed but must be explicit: `# ponytail: bare except intentional`
          # or `# noqa: BLE001` (repo convention for intentional broad-except, 250+ sites).
          if grep -R --include="*.py" -n "except Exception" tools/mcp_tools tools/exploit_agent tools/mcp_session.py | grep -v "_EXC_GROUP_CATCH" | grep -v "ponytail: bare except intentional" | grep -v "noqa: BLE001" | grep -q .; then
            echo "ERROR: bare 'except Exception' found in MCP-adjacent code without _EXC_GROUP_CATCH."
            echo "Use 'except _EXC_GROUP_CATCH as exc:' + '_log_nested_exceptions(exc)' (see tools/exceptions.py)."
            echo "If this is intentionally non-MCP, annotate with '# ponytail: bare except intentional' or '# noqa: BLE001'."
            echo "--- offenders ---"
            grep -R --include="*.py" -n "except Exception" tools/mcp_tools tools/exploit_agent tools/mcp_session.py | grep -v "_EXC_GROUP_CATCH" | grep -v "ponytail: bare except intentional" | grep -v "noqa: BLE001" || true
            exit 1
          fi
          echo "MCP bare-except guard: OK"
      - name: God-file budget (no new file >1000 LOC / 72kB)
        run: |
          python -c "
          import pathlib
          limit = 600 * 120
          # Legacy grandfathered files (pre-date the budget guard, already >1000 LOC / 72kB):
          # they are exempt, but NEW files must still satisfy the budget.
          grandfathered = {
              'tools/api/routes/system.py',
              'tools/exploit_agent/runner/_impl.py',
          }
          bad = []
          for p in pathlib.Path('tools').rglob('*.py'):
              if p.as_posix() in grandfathered:
                  continue
              try:
                  text = p.read_text(encoding='utf-8', errors='ignore')
              except OSError:
                  continue
              loc = len(text.splitlines())
              if loc > 1000 and p.stat().st_size >= limit:
                  bad.append(f'{p} ({loc} LOC, {p.stat().st_size} B)')
          assert not bad, 'god-file budget exceeded: new file >1000 LOC must stay <72kB (600*120) or be split: ' + ', '.join(bad)
          "
      - name: Config schema / YAML sync check (top-level keys)
        run: |
          python -c "
          import yaml
          from tools.config_manager import CONFIG_SCHEMA
          cfg = yaml.safe_load(open('config.yaml'))
          assert set(cfg) == set(CONFIG_SCHEMA), f'config.yaml and CONFIG_SCHEMA drift: extra in yaml {sorted(set(cfg)-set(CONFIG_SCHEMA))}, missing in yaml {sorted(set(CONFIG_SCHEMA)-set(cfg))}'
          "
      - name: Requirements / pyproject sync check
        run: |
          python -c "
          import pathlib, re, tomllib
          py = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          deps = set()
          for d in py['project']['dependencies']:
              deps.add(re.split('[<>=; ]', d.strip())[0].lower())
          for extra in ('dev',):
              for d in py['project']['optional-dependencies'][extra]:
                  deps.add(re.split('[<>=; ]', d.strip())[0].lower())
          # browser extra is intentionally NOT in requirements.txt
          for d in py['project']['optional-dependencies'].get('browser', []):
              deps.discard(re.split('[<>=; ]', d.strip())[0].lower())
          # ollama extra is included via dev already
          req_lines = [l.strip() for l in pathlib.Path('requirements.txt').read_text().splitlines() if l.strip() and not l.strip().startswith('#')]
          reqs = set(re.split('[<>=; ]', l)[0].lower() for l in req_lines)
          missing = sorted(deps - reqs)
          assert not missing, f'requirements.txt missing deps from pyproject.toml: {missing}'
          print(f'requirements sync ok: {len(reqs)} reqs cover {len(deps)} pyproject deps')
          "
      - name: Doctor --json machine-readable output check
        run: |
          python main.py --doctor --json | python -c "
          import json, sys
          data = json.load(sys.stdin)
          assert 'checks' in data and 'is_valid' in data and 'unknown_keys' in data, 'doctor --json missing keys'
          print(f\"doctor --json ok: is_valid={data['is_valid']}, checks={len(data['checks'])}\")
          "
      - name: Docs truth guard (no-args startup)
        run: |
          # Fail if any doc claims the no-args default launches the interactive
          # menu. Truth: `python main.py` with no args starts the WebUI daemon
          # (main.py no-args branch -> _run_daemon); `--menu` is the terminal menu.
          offenders=$(grep -R -n -i -E \
            "interactive menu \(default|menu (is )?the default no-arg|no-args default.*(interactive|questionary) menu|# interactive menu \(default\)" \
            README.md CLAUDE.md AGENTS.md CONTRIBUTING.md docs/ 2>/dev/null || true)
          if [ -n "$offenders" ]; then
            echo "ERROR: stale no-args startup claims found (no-args = WebUI daemon, not the menu):"
            echo "$offenders"
            exit 1
          fi
          echo "Docs truth guard (no-args startup): OK"

  types:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Cache mypy
        uses: actions/cache@v4
        with:
          path: .mypy_cache
          key: mypy-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            mypy-${{ runner.os }}-
      - name: Install project + dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-dev.txt -e ".[dev]"
      - name: Debug mypy env
        run: |
          mypy --version
          python --version
          grep -A2 "python_version" pyproject.toml || true
      - name: Mypy check (256 files, permissive)
        run: |
          set -o pipefail
          mypy --follow-imports=skip tools 2>&1 | tee mypy.log
      - name: Upload mypy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-log
          path: mypy.log
          if-no-files-found: warn
          retention-days: 1
      - name: Mypy strict hot files (zero disables)
        run: mypy --follow-imports=skip tools/validation_utils.py tools/exceptions.py tools/mcp_shared.py

  package:
    name: Package build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            constraints-dev.txt
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
      - name: Build sdist + wheel
        run: python -m build
      - name: Verify distributions
        run: python -m twine check dist/*
      - name: Install wheel + import smoke
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -c "import tools.exploit_agent; from tools.exploit_agent import run_exploit_agent; import tools.exploit_agent.runner._impl; print('wheel import smoke: ok')"
      - name: Clean-CWD installed-wheel smoke (no repo checkout)
        run: |
          TMPDIR=$(mktemp -d)
          echo "Testing installed wheel from clean dir: $TMPDIR (no config.yaml, no skills checkout)"
          ls -la "$TMPDIR"
          (cd "$TMPDIR" && breachpilot --doctor --json > doctor.json || true)
          cat "$TMPDIR/doctor.json" || true
          python -c "import textwrap; exec(textwrap.dedent(r\"\"\"
          import json, pathlib, sys
          data = json.loads(pathlib.Path('$TMPDIR/doctor.json').read_text(encoding='utf-8'))
          assert 'checks' in data and 'is_valid' in data, 'doctor json shape'
          print('doctor checks:', [(c['name'], c['ok']) for c in data['checks']])
          \"\"\"))"
          (cd "$TMPDIR" && python - <<'PY'
          import pathlib
          from tools.paths import get_packaged_skills_dir
          pkg = get_packaged_skills_dir()
          assert pkg.is_dir(), f'packaged skills dir missing: {pkg}'
          assert any(pkg.rglob('SKILL.md')), f'no SKILL.md under {pkg}'
          print(f'packaged skills ok: {pkg} ({len(list(pkg.rglob("SKILL.md")))} SKILL.md)')
          from tools.paths import load_effective_config
          cfg = load_effective_config()
          assert 'sandbox' in cfg and cfg['sandbox']['enabled'] is True, f"sandbox.enabled should be True by default, got {cfg.get('sandbox')}"
          assert 'skills' in cfg and cfg['skills']['roots'] == ['skills'], f"skills.roots default {cfg.get('skills')}"
          print(f"effective config defaults ok: sandbox.enabled={cfg['sandbox']['enabled']}")
          from tools.skill_registry_cache import get_registry, clear_cache
          clear_cache()
          reg = get_registry()
          assert len(reg.skills) > 100, f'expected >100 skills from packaged catalog, got {len(reg.skills)}'
          assert not any('root does not exist' in e for e in reg.errors), f'unexpected registry errors: {reg.errors[:3]}'
          print(f'skill registry ok: {len(reg.skills)} skills, {len(reg.errors)} errors')
          from tools.sandbox.models import SandboxConfig
          scfg = SandboxConfig.from_config(cfg)
          assert scfg.enabled is True, 'SandboxConfig should be enabled with effective config'
          print(f'sandbox config ok: enabled={scfg.enabled}')
          import tempfile, yaml, pathlib as pl
          with tempfile.NamedTemporaryFile(mode='w', suffix='.yaml', delete=False) as tf:
              yaml.safe_dump({'sandbox': {'enabled': False}}, tf)
              custom = tf.name
          cfg2 = load_effective_config(custom)
          assert cfg2['sandbox']['enabled'] is False, 'explicit custom config should override default'
          print(f'explicit --config override ok: {custom} -> sandbox.enabled=False')
          pl.Path(custom).unlink(missing_ok=True)
          import tempfile as tf2
          with tf2.TemporaryDirectory() as td:
              td_path = pathlib.Path(td)
              (td_path / 'my_skills' / 'demo').mkdir(parents=True)
              (td_path / 'my_skills' / 'demo' / 'SKILL.md').write_text("---\nname: demo\ntags: [demo]\ndescription: demo\n---\n# Demo\n", encoding='utf-8')
              custom_cfg = {'skills': {'roots': [str(td_path / 'my_skills')]}}
              clear_cache()
              reg2 = get_registry(custom_cfg)
              assert 'demo' in reg2.skills, f'custom skill root not loaded: {list(reg2.skills.keys())[:5]}'
              print(f'explicit skill root ok: {td_path}/my_skills -> demo found')
          print('all clean-CWD wheel checks passed')
          PY
          )
          rm -rf "$TMPDIR"
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  webui:
    name: WebUI build + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Clean install
        run: npm ci
      - name: Build (tsc + vite)
        run: npm run build
      - name: Unit tests (vitest)
        run: npm run test

  ci:
    name: CI success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [tests, sandbox, browser, coverage, lint, types, package, webui]
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJson(needs) }}'
          echo "$results" | python -c "
          import json, sys
          needs = json.loads(sys.argv[1])
          failed = [k for k, v in needs.items() if v['result'] != 'success']
          if failed:
              print(f\"CI failed: {failed}\")
              for k, v in needs.items():
                  print(f\"  {k}: {v['result']}\")
              sys.exit(1)
          print('All CI jobs passed')
          " "$results"
