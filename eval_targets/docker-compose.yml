# BreachPilot — Standard Docker Target Suite for Benchmarking (D1)
#
# Spins up a set of deliberately vulnerable local-lab targets for eval/benchmark
# runs. The operator adds the host ports to `exploit.allowed_targets` for the
# run (the eval harness targets `localhost` / 127.0.0.1).
#
# Targets:
#   - Metasploitable2  (tleemcjr/metasploitable2)                :  ports 21,22,23,80,445,3306 (host 2121,2222,2323,8082,4455,3306)
#   - DVWA             (vulnerables/web-dvwa)                  :  port 8081
#   - juice-shop       (bkimminich/juice-shop)                 :  port 3000
#   - vulnerable-k8s   (hashicorp/http-echo stub, see below)   :  port 8083 (no 6443 mapping — only 8083 is exposed)
#
# Usage:
#   docker compose -f eval_targets/docker-compose.yml up -d
#   docker compose -f eval_targets/docker-compose.yml down
#
# Safety: these are LOCAL LAB targets only. The compose file binds every port
# to 127.0.0.1 so nothing is exposed to the network. Add `127.0.0.1` to
# `exploit.allowed_targets` in config.yaml for the run.
# ponytail: 127.0.0.1 bind on every port — no network exposure by construction.

services:
  metasploitable2:
    image: tleemcjr/metasploitable2
    container_name: breachpilot-metasploitable2
    # image CMD ends in `bash` (no server process): keep a tty so it stays up detached.
    tty: true
    stdin_open: true
    ports:
      - "127.0.0.1:8082:80"
      - "127.0.0.1:2222:22"
      - "127.0.0.1:2121:21"
      - "127.0.0.1:2323:23"
      - "127.0.0.1:4455:445"
      - "127.0.0.1:3306:3306"
    networks:
      - eval_net
    restart: "no"

  dvwa:
    image: vulnerables/web-dvwa
    container_name: breachpilot-dvwa
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - eval_net
    restart: "no"

  juice_shop:
    image: bkimminich/juice-shop
    container_name: breachpilot-juice-shop
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - eval_net
    restart: "no"

  # vulnerable k8s cluster — original kinvolk image was removed from Docker
  # Hub, so this is a minimal loopback stub that answers the xben oracle
  # (GET /version -> 200). Swap in a real misconfigured cluster if needed.
  # ponytail: http-echo stub, not a real k8s; upgrade when a maintained image exists.
  vulnerable_k8s:
    image: hashicorp/http-echo:latest
    container_name: breachpilot-vuln-k8s
    command: ["-listen=:8080", "-text=k8s-ok"]
    ports:
      - "127.0.0.1:8083:8080"
    networks:
      - eval_net
    restart: "no"

networks:
  eval_net:
    driver: bridge