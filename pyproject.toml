[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "breachpilot"
version = "0.68.4"
description = "AI-driven, locally-run penetration testing / bug bounty research agent"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    {name = "BreachPilot Team"},
]
keywords = ["security", "penetration-testing", "nmap", "ai", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

dependencies = [
    # Core is provider-neutral: the Ollama Python SDK moves to the optional
    # `ollama` extra below. Selecting `models.provider: opencode_go` (or
    # `chatgpt`) needs NO Ollama package or daemon at runtime.
    "httpx>=0.27.0",
    "mcp>=1.27.0,<2.0.0",
    "PyYAML>=6.0.2",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "fastapi>=0.110.0",
    "websockets>=12.0",
    "questionary>=2.0.0",
    "numpy>=1.24.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
# Ollama provider support (also pulled in by `dev`). `pip install -e ".[ollama]"`
# restores the pre-provider-era behavior of a plain `pip install -e .`.
ollama = ["ollama>=0.6.1"]
# Playwright browser-agent support (optional). `pip install -e ".[browser]"`
# adds the Playwright Python SDK for host-side dev/tests; real execution runs
# inside the sandbox browser worker (docker/sandbox/Dockerfile.browser), which
# installs the SDK + Chromium itself. Stock installs without it keep working.
browser = ["playwright>=1.44"]
dev = [
    "ollama>=0.6.1",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.0.0",
    "pytest-timeout>=2.0.0",
    "coverage>=7.3.0",
    "ruff>=0.6.0",
    "mypy>=2.0",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
breachpilot = "main:main"

[tool.setuptools]
py-modules = [
    "agent_loop",
    "app",
    "cli",
    "db",
    "evidence",
    "executor",
    "finding_verifier",
    "main",
    "mcp_engine_server",
    "mcp_exploit_server",
    "mcp_server",
    "memory",
    "mission",
    "observer",
    "outcome_judge",
    "planner",
    "report_generator",
    "risk_controller",
    "scope_gate",
    "summarizer",
    "target_graph",
    "task_queue",
    "tool_router",
]

[tool.setuptools.packages.find]
include = ["tools*", "legacy*", "skills*"]

[tool.setuptools.package-data]
skills = ["**/*"]
tools = ["mitre_technique_map.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
timeout = 120
# ponytail: bare pytest runs the CI envelope (mocked/offline). Docker-backed
# integration + live-LLM evals are opt-in via `-m integration` / `-m live_llm`;
# without this, concurrent `-n auto` full-suite runs on a laptop spawn real
# containers/Chromium against the same GPU kwin is compositing on.
addopts = ["-m", "not integration and not live_llm"]
markers = [
    "live_llm: live-model evaluations requiring API keys/network (skipped in normal CI)",
    "integration: integration tests requiring Docker or external services (skipped in normal CI when unavailable)",
]

[tool.coverage.run]
# ponytail: bare module names, not "main.py". The ".py" suffix makes coverage
# find_spec("main.py") at startup, which executes main.py (pulling numpy in via
# tools.skill_embeddings) and then purges it from sys.modules — numpy's C
# extension can't re-init, so every later `import numpy` dies with
# "cannot load module more than once per process".
source = ["tools", "main", "cli", "legacy"]  # ponytail: cli is legacy shim re-exporting legacy.cli; coverage measures shim re-export
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
fail_under = 80

[tool.ruff]
line-length = 120
# ponytail: exclude generated/runtime dirs + non-Python webui/oauth so `ruff check .` passes (0 errors)
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".mypy_cache",
    ".ruff_cache",
    "exploit_workspace",
    "research_workspace",
    "reports",
    "webui",
    "oauth",
    "docs",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "F405", "F403", "F841"]
# ponytail: star-import helpers (tools/mcp_tools/* via `from registry import *`) are intentional;
# F405/F403 are the allowlist-lock wiring, not accidental shadowing. F841 (unused-variable)
# in attack modules is often a placeholder for future params.

[tool.ruff.lint.per-file-ignores]
# Lab build: operator-box filesystem is unrestricted; path-traversal gates removed intentionally
"tools/mcp_tools/*.py" = ["F405", "F403", "F401", "F841", "E402"]
"tools/mcp_tools/modules/*.py" = ["F405", "F403", "F401", "F841", "E402"]
"tools/mcp_tools/terminal/*.py" = ["F405", "F403", "F401", "F841", "E402"]
"tools/kernel/*.py" = ["F401"]
"tests/*.py" = ["F401", "F841", "E402"]
# facade re-exports intentional — public API via __all__, private helpers patched via sys.modules
"tools/exploit_agent/__init__.py" = ["F401"]
# advisory skill scripts use try/except import-availability pattern; not core engine
"skills/**/*.py" = ["F401"]
# main.py and exploit loop use late imports after ui bootstrap (ui = get_ui() must precede)
"main.py" = ["E402"]
"tools/exploit_agent/runner/*.py" = ["E402"]
# PEP 562 lazy questionary (attack_ui) + lazy numpy annotations (semantic_memory):
# names resolve via module __getattr__ / function-level imports, invisible to static F821
"tools/attack_ui.py" = ["F821"]
"tools/semantic_memory.py" = ["F821"]
"tools/exploit_agent/phase_tracker.py" = ["E402"]
"tools/campaign/*.py" = ["E402", "F821", "I001"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
# ponytail: `mypy --follow-imports=skip tools` passes (335 files) with these disables.
# Without disables: 301 errors in 65 files — see mypy-baseline.txt, enforced by
# `python scripts/mypy_debt.py` (CI types job fails on ANY increase).
# Strict tiers (zero disables): tools/validation_utils.py, tools/exceptions.py,
# tools/mcp_shared.py, tools/kernel/*, tools/sandbox/*. Migration order and
# graduation procedure: docs/type-checking.md. No `Any` in new code; use
# Optional/TypedDict/Protocols.
disable_error_code = [
    "no-any-return",
    "attr-defined",
    "union-attr",
    "assignment",
    "arg-type",
    "call-arg",
    "operator",
    "index",
    "list-item",
    "return-value",
    "type-var",
    "valid-type",
    "no-redef",
    "var-annotated",
    "misc",
    "name-defined",
    "truthy-function",
    "func-returns-value",
    "dict-item",
    "no-untyped-def",
    "has-type",
    "str-unpack",
]

[[tool.mypy.overrides]]
module = "tools.*"
ignore_errors = false
disable_error_code = [
    "no-any-return",
    "attr-defined",
    "union-attr",
    "assignment",
    "arg-type",
    "call-arg",
    "operator",
    "index",
    "list-item",
    "name-defined",
    "truthy-function",
    "func-returns-value",
    "dict-item",
]

[[tool.mypy.overrides]]
module = ["tools.validation_utils", "tools.exceptions", "tools.mcp_shared"]
# Strict: per-file incremental — zero disables (ponytail: 2026-08-25)
disable_error_code = []
enable_error_code = [
    "no-any-return",
    "attr-defined",
    "union-attr",
    "assignment",
    "arg-type",
    "call-arg",
    "operator",
    "index",
    "list-item",
    "return-value",
    "type-var",
    "valid-type",
    "no-redef",
    "var-annotated",
    "misc",
    "name-defined",
    "truthy-function",
    "func-returns-value",
    "dict-item",
    "no-untyped-def",
    "has-type",
    "str-unpack",
    "call-overload",
]

# Tier 1 (2026-09-07): tools/kernel + tools/sandbox graduate to strict.
# Both packages are fully annotated with zero errors under every code in the
# list below (verified via scripts/mypy_debt.py hermetic pass + the
# `Mypy strict subsystems` CI step). Next tiers per docs/type-checking.md:
# tools/api (run_manager.py holds most of its 45), orchestration/session,
# then remaining modules.
[[tool.mypy.overrides]]
module = ["tools.kernel.*", "tools.sandbox.*"]
disable_error_code = []
enable_error_code = [
    "no-any-return",
    "attr-defined",
    "union-attr",
    "assignment",
    "arg-type",
    "call-arg",
    "operator",
    "index",
    "list-item",
    "return-value",
    "type-var",
    "valid-type",
    "no-redef",
    "var-annotated",
    "misc",
    "name-defined",
    "truthy-function",
    "func-returns-value",
    "dict-item",
    "no-untyped-def",
    "has-type",
    "str-unpack",
    "call-overload",
]

[[tool.mypy.overrides]]
module = ["tools.nmap_priv"]
warn_return_any = false
